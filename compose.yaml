services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vector-observatory-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///./data/vector_observatory.db
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=vector-observatory
      - KEYCLOAK_CLIENT_ID=vector-observatory-client
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173","http://localhost"]
    volumes:
      - backend_data:/app/data
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vector-observatory-frontend
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: vector-observatory-keycloak
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
    command: start-dev --import-realm
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  backend_data:
  keycloak_data: